# docker compose up -d --build
services:
  yaypost:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # put HTTPS (e.g. Caddy) in front before exposing it publicly
    env_file:
      - path: .env
        required: false
    volumes:
      - yaypost-data:/data

volumes:
  yaypost-data:
